{% extends "base.html" %}

{% block title %}{{ title }} — FormSaathi{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 600px; margin: 3rem auto; padding: 3rem 2rem;">
  <div class="empty-state-icon" style="color: var(--danger-600);">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <div style="font-size: 2.5rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.5rem;">
    Error {{ code }}
  </div>
  <h3 class="empty-state-title" style="margin-bottom: 0.75rem;">
    {{ title }}
  </h3>
  <p class="empty-state-desc" style="margin-bottom: 2rem;">
    {{ message }}
  </p>
  <div style="display: flex; justify-content: center; gap: 0.75rem;">
    <a href="{{ url_for('home') }}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return to Home
    </a>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
      <i class="fa-solid fa-chart-pie"></i> Go to Dashboard
    </a>
  </div>
</div>
{% endblock %}
